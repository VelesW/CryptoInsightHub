user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
  use                epoll;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;
  server_tokens   off;

  # Limits
  client_max_body_size 10M;

  # Logging — reduce verbosity in production
  access_log  /var/log/nginx/access.log  combined;

  # Compression
  gzip              on;
  gzip_types        text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length   256;
  gzip_proxied      any;
  gzip_vary         on;

  # Security headers — adjust as needed for your application
  map $sent_http_content_type $is_html {
    "~*text/html" 1;
    default 0;
  }

  server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Health check endpoint for container orchestrators
    location = /healthz {
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # Serve static assets directly; fallback to index.html for SPA routes
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Long-term caching for fingerprinted assets (css/js/maps/json)
    location ~* \.(?:css|js|json|map|xml|txt)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
      expires 1y;
    }

    # Images & fonts caching
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|avif|ttf|woff2?|eot)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
      expires 1y;
    }

    # HTML should not be aggressively cached so SPA routes update properly
    location ~* \.(?:html)$ {
      try_files $uri =404;
      add_header Cache-Control "no-store, must-revalidate";
    }

    # Minimal security headers for responses
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Error pages (serve the SPA index for unknown routes optionally)
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
      internal;
      root /usr/share/nginx/html;
    }
  }
}
